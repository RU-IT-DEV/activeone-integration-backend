query CustomerDetails($customerId: ID!) {
  customer(id: $customerId) {
    id
    firstName
    lastName
    email
    phone
    numberOfOrders
    amountSpent {
      amount
      currencyCode
    }
    createdAt
    updatedAt
    note
    verifiedEmail
    validEmailAddress
    tags
    lifetimeDuration
    defaultAddress {
      formattedArea
      address1
    }
    addresses {
      address1
    }
    image {
      url
    }
    canDelete
    metafields(identifiers: [
        { namespace: "custom", key: "account_number" },
        { namespace: "custom", key: "coverage_end" },
        { namespace: "custom", key: "contract" },
        { namespace: "custom", key: "status" },
        { namespace: "custom", key: "birth_date" },
    ]) {
        id
        namespace
        key
        value
        type
    }
  }
}