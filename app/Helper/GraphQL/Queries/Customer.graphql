query CustomerDetails($customerId: ID!) {
  customer(id: $customerId) {
    id
    firstName
    lastName
    email
    phone
    numberOfOrders
    amountSpent {
      amount
      currencyCode
    }
    createdAt
    updatedAt
    note
    verifiedEmail
    validEmailAddress
    tags
    lifetimeDuration
    defaultAddress {
      formattedArea
      address1
    }
    addresses {
      address1
    }
    image {
      url
    }
    canDelete
    metafields (first: 10) {
      ... on MetafieldConnection {
        nodes {
          namespace
          key
          value
          type
        }
      }
    }
  }
}