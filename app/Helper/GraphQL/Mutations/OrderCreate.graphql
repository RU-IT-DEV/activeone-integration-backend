mutation OrderCreate($order: OrderCreateOrderInput!) {
  orderCreate(order: $order) {
    order {
      id
      name
      displayFinancialStatus
      displayFulfillmentStatus

      billingAddress {
        address1
        address2
        city
        provinceCode
        countryCodeV2
        zip
        firstName
        lastName
        phone
      }

      shippingAddress {
        address1
        address2
        city
        provinceCode
        countryCodeV2
        zip
        firstName
        lastName
        phone
      }

      lineItems(first: 50) {
        edges {
          node {
            id
            title
            quantity
            sku
          }
        }
      }
    }

    userErrors {
      field
      message
    }
  }
}